[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-cli"
version = "0.1.0"
description = "CLI for a student's own Canvas LMS work: proof-of-work assignments, outcome standing and new feedback"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.scripts]
canvas = "canvas_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is entirely offline: `responses` answers every request from
# hand-written Canvas payloads, so it never touches a real course.
addopts = "-q"

[tool.ruff]
line-length = 100
